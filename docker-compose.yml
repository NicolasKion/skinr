# The whole stack on http://localhost:5200:
#   docker compose up --build
# Hot-reloading frontend instead of the built one:
#   docker compose --profile dev up -d postgres api frontend-dev
# Postgres alone, for `cargo run` + `npm run dev` on the host:
#   docker compose up -d postgres
# Rebuild the API and frontend whenever their code changes:
#   docker compose watch

# The compose project: names the containers, network and volumes.
name: skinr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: skinr
      POSTGRES_PASSWORD: skinr
      POSTGRES_DB: skinr
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinr"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # Downloads the latest SDE and seeds it, only when the build changed.
  sde-import:
    build: .
    # One image with the API, so a rebuild never leaves the importer behind
    # on an older set of migrations.
    image: skinr:latest
    command: ["sde_import"]
    environment:
      DATABASE_URL: postgres://skinr:skinr@postgres:5432/skinr
      SDE_FORCE: ${SDE_FORCE:-0}
    volumes:
      - sde-cache:/app/storage/sde
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build: .
    image: skinr:latest
    environment:
      DATABASE_URL: postgres://skinr:skinr@postgres:5432/skinr
      BIND_ADDR: 0.0.0.0:3100
      RUST_LOG: ${RUST_LOG:-info}
      # Names the app to ESI, ideally with a contact (see .env.example).
      ESI_USER_AGENT: ${ESI_USER_AGENT:-skinr.space/0.1}
      # Log in with EVE; off until the app is registered (see .env.example).
      EVE_CLIENT_ID: ${EVE_CLIENT_ID:-}
      EVE_CLIENT_SECRET: ${EVE_CLIENT_SECRET:-}
      EVE_CALLBACK_URL: ${EVE_CALLBACK_URL:-https://skinr-space.test/eve/callback}
      # The site's origin, for the sitemap's absolute URLs.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://skinr-space.test}
      # Draws the ship thumbnails and the Open Graph cards' liveries.
      RENDERER_URL: http://renderer:3200
      # As many thumbnails in flight as the renderer has workers.
      THUMBNAIL_CONCURRENCY: ${RENDER_WORKERS:-6}
      OG_CACHE_DIR: /app/storage/og
      # Debug tools under /api/debug (drawing a livery's thumbnails); never in production.
      DEBUG_TOOLS: ${DEBUG_TOOLS:-1}
    volumes:
      # Ship thumbnails, kept current by the api (src/thumbnails.rs).
      - thumbnails:/app/storage/thumbnails
      # Game files fetched from CCP once, each with a zstd copy (game_files).
      - cdn-cache:/app/storage/cdn-cache
      # Rendered Open Graph cards and ship renders.
      - og-cache:/app/storage/og
    depends_on:
      postgres:
        condition: service_healthy
      sde-import:
        condition: service_completed_successfully
    # Postgres can take a while to accept connections after a reboot.
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./migrations }
        - { action: rebuild, path: ./Cargo.toml }
        - { action: rebuild, path: ./Cargo.lock }
        - { action: rebuild, path: ./assets }
    logging: *logging

  # The render worker (frontend/scripts/render-server.ts, Node with Dawn's
  # WebGPU): the ship thumbnails and the Open Graph cards' liveries, for the
  # API. Internal only, no port published. It draws with lavapipe on the CPU,
  # like production.
  renderer:
    build:
      context: ./frontend
      dockerfile: Dockerfile.renderer
    environment:
      API: http://api:3100
      # Worker processes drawing at once, each up to MAX_RSS_MB (3 GB).
      WORKERS: ${RENDER_WORKERS:-6}
    volumes:
      # The API's game file cache, the same layout.
      - cdn-cache:/app/storage/cdn-cache
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: ./frontend/scripts }
        - { action: rebuild, path: ./frontend/src/lib/viewer }
        - { action: rebuild, path: ./frontend/src/lib/skinr.ts }
    logging: *logging

  frontend:
    build: ./frontend
    environment:
      AXUM_URL: http://api:3100
      # Canonical links and Open Graph tags (seo.svelte); the request origin
      # would be localhost behind portal.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://skinr-space.test}
      # Shows the debug tools; the api needs the same switch.
      DEBUG_TOOLS: ${DEBUG_TOOLS:-1}
    depends_on:
      - api
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore: [node_modules/, .svelte-kit/, build/]
    logging: *logging

  proxy:
    build: ./deploy
    ports:
      - "127.0.0.1:5200:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    logging: *logging

  frontend-dev:
    image: node:22
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npx vite dev --host 0.0.0.0 --port 5200"
    environment:
      AXUM_URL: http://api:3100
      VITE_POLL_WATCH: "1"
    ports:
      - "127.0.0.1:5200:5200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    logging: *logging

volumes:
  postgres-data:
  sde-cache:
  cdn-cache:
  og-cache:
  thumbnails:
  frontend-node-modules:
