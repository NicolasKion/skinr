# The whole stack on http://localhost:5200:
#   docker compose up --build
# Hot-reloading frontend instead of the built one:
#   docker compose --profile dev up -d postgres api frontend-dev
# Postgres alone, for `cargo run` + `npm run dev` on the host:
#   docker compose up -d postgres
# Rebuild the API and frontend whenever their code changes:
#   docker compose watch

# The compose project: names the containers, network and volumes.
name: skinr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: skinr
      POSTGRES_PASSWORD: skinr
      POSTGRES_DB: skinr
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinr"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging: *logging

  # Downloads the latest SDE and seeds it, only when the build changed.
  sde-import:
    build: .
    # One image with the API, so a rebuild never leaves the importer behind
    # on an older set of migrations.
    image: skinr:latest
    command: ["sde_import"]
    environment:
      DATABASE_URL: postgres://skinr:skinr@postgres:5432/skinr
      SDE_FORCE: ${SDE_FORCE:-0}
    volumes:
      - sde-cache:/app/storage/sde
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build: .
    image: skinr:latest
    environment:
      DATABASE_URL: postgres://skinr:skinr@postgres:5432/skinr
      BIND_ADDR: 0.0.0.0:3100
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      sde-import:
        condition: service_completed_successfully
    # Postgres can take a while to accept connections after a reboot.
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./migrations }
        - { action: rebuild, path: ./Cargo.toml }
        - { action: rebuild, path: ./Cargo.lock }
    logging: *logging

  frontend:
    build: ./frontend
    environment:
      AXUM_URL: http://api:3100
      ORIGIN: http://localhost:5200
    depends_on:
      - api
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore: [node_modules/, .svelte-kit/, build/]
    logging: *logging

  proxy:
    image: caddy:2
    ports:
      - "127.0.0.1:5200:5200"
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    logging: *logging

  frontend-dev:
    image: node:22
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npx vite dev --host 0.0.0.0 --port 5200"
    environment:
      AXUM_URL: http://api:3100
      VITE_POLL_WATCH: "1"
    ports:
      - "127.0.0.1:5200:5200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    logging: *logging

volumes:
  postgres-data:
  sde-cache:
  frontend-node-modules:
