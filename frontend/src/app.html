<!doctype html>
<html lang="en" class="%theme%" data-booting>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    %sveltekit.head%
    <!-- Without scripts nothing lifts the boot screen, so it never shows. -->
    <noscript
      ><style>
        .boot {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
