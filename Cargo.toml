[package]
name = "skinr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browse and view EVE Online ships in the browser"
default-run = "skinr"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
futures-util = "0.3"
png = "0.18.1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
] }
texture2ddecoder = "0.1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "skinr"
path = "src/main.rs"

[[bin]]
name = "sde_import"
path = "src/bin/sde_import.rs"

[lints.clippy]
# Handlers return `Result<_, Response>`, as in MutaMarket.
result_large_err = "allow"
