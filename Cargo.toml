[package]
name = "skinr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browse and view EVE Online ships in the browser"
default-run = "skinr"

[dependencies]
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# EVE SSO access tokens are RS256 JWTs, checked against CCP's JWKS.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
png = "0.18.1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    # The SSO token exchange posts a form.
    "form",
    "gzip",
    "stream",
] }
# Open Graph cards (src/og) are SVG rasterized by resvg. System fonts stay
# off so the embedded Inter faces are the only ones, the same on every machine;
# raster-images decodes the ship renders (PNG) and portraits (JPEG).
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "migrate",
] }
texture2ddecoder = "0.1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Glyph advances, for fitting card text.
ttf-parser = "0.25"
# NFKD for URL slugs (src/urls.rs), as the frontend does.
unicode-normalization = "0.1"
webp = { version = "0.3", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "skinr"
path = "src/main.rs"

[[bin]]
name = "sde_import"
path = "src/bin/sde_import.rs"

[lints.clippy]
# Handlers return `Result<_, Response>`, as in MutaMarket.
result_large_err = "allow"
